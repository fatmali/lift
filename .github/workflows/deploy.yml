name: Deploy to GitHub Pages

on:
  push:
    # The feature branch is currently the default; main is listed so the
    # deploy survives a later merge without needing an edit here.
    branches: ['claude/lift-strength-training-pwa-prha99', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Domain checks
        run: npm run check

      - name: Build
        # Project Pages are served from /<repo>/, so the base path is derived
        # from the repository name rather than hard-coded.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Turns Pages on via the API if it is not already enabled, so the first
      # run does not need a manual visit to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
